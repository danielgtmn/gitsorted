version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on Node LTS (24). Node 25+ no longer ships corepack, which the
      # Dockerfile uses to install pnpm – move to the next LTS deliberately.
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
